# Weekly live-data refresh for Joota Pulse.
# Every Monday (02:17 Pakistan time) it collects fresh YouTube comments, re-runs the
# audience engine (github.com/usamahanif349/pk-footwear-audience-engine) and republishes
# the site. It also runs on demand (Actions > Weekly data refresh > Run workflow).
# A push to main only republishes the site, without collecting new data.
name: Weekly data refresh

on:
  schedule:
    - cron: "17 21 * * 0"        # every Monday 02:17 Pakistan time
    - cron: "30 8 15-18 11 *"    # extra deep-collection runs, 15-18 Nov 2026, 13:30 Pakistan time
  workflow_dispatch:
    inputs:
      units:
        description: "YouTube API units this run may use (free limit is 10,000 a day)"
        required: false
        default: "9000"
      collect:
        description: "Collect new data from YouTube? (no = re-run the analysis on the saved archive, 0 units)"
        required: false
        default: "yes"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the audience engine
        if: github.event_name != 'push'
        uses: actions/checkout@v4
        with:
          repository: usamahanif349/pk-footwear-audience-engine
          path: engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        if: github.event_name != 'push'
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet pandas numpy scikit-learn google-api-python-client langdetect sentence-transformers

      - name: Collect, analyse and export
        id: collect
        if: github.event_name != 'push'
        # if YouTube fails (e.g. daily quota used up), keep last week's data and still publish the site
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          UNIT_LIMIT: ${{ github.event.inputs.units || '9000' }}
          COLLECT: ${{ github.event.inputs.collect || 'yes' }}
        run: python engine/src/live/refresh.py --state state --out data.json

      - name: Save the new data
        if: github.event_name != 'push' && steps.collect.outcome == 'success'
        run: |
          git config user.name "USAMA HANIF"
          git config user.email "usamahanif349@gmail.com"
          mkdir -p analyst-data
          cp engine/data/processed/{table_a_posts.csv,content_all_posts.csv,comments_labeled.csv,videos_enriched.csv,comment_segments.csv,unusual_posts.csv,clusters.csv,cluster_map.csv,method_metrics.json,pipeline_stats.json} analyst-data/
          git add state data.json analyst-data
          git commit -m "Weekly data refresh $(date -u +%F)" || echo "No changes"
          git pull --rebase -X theirs -q
          git push

      - name: Build the site folder
        run: |
          mkdir _site
          cp index.html app.html audit.html audit.js styles.css app.js site.js data.json preview.jpg founder.jpg _site/
          touch _site/.nojekyll

      - name: Take fresh screenshots for the home page
        run: |
          pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium > /dev/null
          (cd _site && python -m http.server 8000 > /dev/null 2>&1 &)
          sleep 2
          python tools/shots.py _site

      - name: Save the screenshots in the repo (used by the Vercel copy of the site)
        run: |
          rm -rf shots && cp -r _site/shots shots && cp _site/preview.jpg preview.jpg
          git config user.name "USAMA HANIF"
          git config user.email "usamahanif349@gmail.com"
          git add shots preview.jpg
          git commit -m "Fresh screenshots $(date -u +%F)" || echo "No changes"
          git pull --rebase -X theirs -q && git push || echo "Push skipped"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
